server {
  listen 4000;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # ── Gzip Compression ──────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;       # Was default (1) — level 6 gives ~30% better ratio
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    text/x-component
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    font/opentype
    font/ttf
    font/woff
    font/woff2
    image/svg+xml
    image/x-icon;

  # ── Brotli (uncomment if nginx-module-brotli is available in Docker image) ──
  # brotli on;
  # brotli_comp_level 6;
  # brotli_types text/plain text/css application/javascript application/json
  #              font/woff font/woff2 image/svg+xml;

  # ── Security Headers ──────────────────────────────────────────
  add_header X-Content-Type-Options  "nosniff"                          always;
  add_header X-Frame-Options         "SAMEORIGIN"                       always;
  add_header X-XSS-Protection        "1; mode=block"                    always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
  add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

  # ── Immutable Long-term Cache for hashed assets ───────────────
  # Matches files with 8+ hex chars in name (Angular output hashing)
  location ~* "\.[0-9a-f]{8,}\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # ── Short cache for non-hashed assets ────────────────────────
  location ~* "\.(svg|png|jpg|jpeg|gif|ico|webp|woff|woff2)$" {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
  }

  # ── SPA Routing ───────────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── index.html — Never cache (always fetch fresh shell) ───────
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # ── manifest.webmanifest — short cache ────────────────────────
  location = /manifest.webmanifest {
    add_header Cache-Control "public, max-age=3600";
    access_log off;
  }

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;
}