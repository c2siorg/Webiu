<div class="publications">
  <div class="publications-hero">
    <div class="publications-hero-content">
      <h1>Our Publications</h1>
      <p>
        Discover a Spectrum of Publications by the researchers at Ceylon
        Computer Science Institute
      </p>
    </div>
    <img src="../../../assets/publications-img.png" alt="publications" fetchpriority="high" />
  </div>
  <div class="publications-cards-container">
    @for (publication of publicationsData; track publication.heading; let i = $index) {
    <app-publications-card [heading]="publication.heading" [link]="publication.link" [issued_by]="publication.issued_by"
      [description]="publication.description"
      appRevealOnScroll [direction]="i % 3 === 0 ? 'left' : (i % 3 === 2 ? 'right' : 'center')" [revealDelay]="(i % 3) * 120"></app-publications-card>}
  </div>
</div>
