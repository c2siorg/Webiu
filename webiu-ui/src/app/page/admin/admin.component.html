<div class="admin-login-container">
  <div class="glass-card">
    <div class="logo-wrapper">
      <img src="../../../assets/c2silogo-dark_no_bg.png" alt="C2SI Logo" class="logo" />
    </div>
    
    <h2>Administrator Access</h2>
    <p class="subtitle">Please authenticate to access the administration panel</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="username"
            placeholder="Enter admin username"
            required
            #usernameInput="ngModel"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter admin password"
            required
            #passwordInput="ngModel"
          />
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        @if (isLoading) {
          <span class="spinner"></span> Authenticating...
        } @else {
          Authenticate
        }
      </button>
    </form>
    
    <a href="/" class="back-home">← Back to Main Website</a>
  </div>
</div>
