<div class="navbar">
  <a [routerLink]="['/']" class="logo-link" (click)="preventReload($event)">
    <img
      src="../../../assets/c2silogo-dark_no_bg.png"
      alt="C2SI Logo"
      class="logo"
    />
  </a>

  @if (isMenuOpen) {
    <div
      class="menu-overlay"
      (click)="closeMenu()"
      (keydown.enter)="closeMenu()"
      (keydown.space)="closeMenu(); $event.preventDefault()"
      tabindex="0"
      role="button"
      [attr.aria-label]="'Close menu'"
    ></div>
  }
  <div
    [ngClass]="{ navbar__menu: true, open: isMenuOpen }"
    id="navbarMenu"
    (click)="$event.stopPropagation()"
    (keydown.enter)="$event.stopPropagation()"
    (keydown.space)="$event.preventDefault(); $event.stopPropagation()"
    tabindex="0"
  >
    <!-- Sidebar Header (visible only when open on mobile) -->
    <div class="sidebar-header">
      <a [routerLink]="['/']" class="logo-link" (click)="closeMenu()">
        <img
          src="../../../assets/c2silogo-dark_no_bg.png"
          alt="C2SI Logo"
          class="logo"
        />
      </a>
      <button
        class="sidebar-close-btn"
        type="button"
        (click)="closeMenu()"
        aria-label="Close menu"
      >
        <img src="../../../assets/cross.svg" alt="Close menu" />
      </button>
    </div>

    <div
      class="navbar__menu__items"
      routerLink="/"
      [class.active]="isRouteActive('/')"
      (click)="navigateTo('/')"
      (keydown.enter)="navigateTo('/')"
      (keydown.space)="navigateTo('/'); $event.preventDefault()"
      tabindex="0"
      role="link"
      [attr.aria-label]="'Home'"
    >
      <img src="../../../assets/home.svg" alt="Home Icon" class="menu-icon" />
      <p>Home</p>
    </div>
    <div
      class="navbar__menu__items"
      routerLink="/projects"
      [class.active]="isRouteActive('/projects')"
      (click)="navigateTo('/projects')"
      (keydown.enter)="navigateTo('/projects')"
      (keydown.space)="navigateTo('/projects'); $event.preventDefault()"
      tabindex="0"
      role="link"
      [attr.aria-label]="'Projects'"
    >
      <img src="../../../assets/projects.svg" alt="Projects Icon" class="menu-icon" />
      <p>Projects</p>
    </div>
    <div
      class="navbar__menu__items"
      routerLink="/publications"
      [class.active]="isRouteActive('/publications')"
      (click)="navigateTo('/publications')"
      (keydown.enter)="navigateTo('/publications')"
      (keydown.space)="navigateTo('/publications'); $event.preventDefault()"
      tabindex="0"
      role="link"
      [attr.aria-label]="'Publications'"
    >
      <img src="../../../assets/publications.svg" alt="Publications Icon" class="menu-icon" />
      <p>Publications</p>
    </div>
    <div
      class="navbar__menu__items"
      routerLink="/contributors"
      [class.active]="isRouteActive('/contributors')"
      (click)="navigateTo('/contributors')"
      (keydown.enter)="navigateTo('/contributors')"
      (keydown.space)="navigateTo('/contributors'); $event.preventDefault()"
      tabindex="0"
      role="link"
      [attr.aria-label]="'Contributors'"
    >
      <img src="../../../assets/contributors.svg" alt="Contributors Icon" class="menu-icon" />
      <p>Contributors</p>
    </div>
    <div class="dropdown-container">
      <div
        class="navbar__menu__items community-toggle"
        [class.active]="isRouteActive('/community')"
        (click)="toggleCommunityDropdown(); $event.stopPropagation()"
        (keydown.enter)="toggleCommunityDropdown(); $event.stopPropagation()"
        (keydown.space)="toggleCommunityDropdown(); $event.stopPropagation(); $event.preventDefault()"
        tabindex="0"
        role="button"
        [attr.aria-label]="'Community Dropdown'"
      >
        <img src="../../../assets/community.svg" alt="Community Icon" class="menu-icon" />
        <p>{{ getCommunityDropdownLabel() }}</p>
        <span class="dropdown-arrow" [class.open]="isCommunityDropdownOpen">▼</span>
      </div>

      @if (isCommunityDropdownOpen) {
        <div class="dropdown-menu community-dropdown" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()" tabindex="-1">
          <div
            class="dropdown-item"
            routerLink="/community"
            [class.active]="currentRoute === '/community'"
            (click)="navigateTo('/community')"
            (keydown.enter)="navigateTo('/community')"
            (keydown.space)="navigateTo('/community'); $event.preventDefault()"
            tabindex="0"
            role="link"
          >
            <p>Community</p>
          </div>
          <div
            class="dropdown-item"
            routerLink="/opportunities"
            [class.active]="currentRoute === '/opportunities'"
            (click)="navigateTo('/opportunities')"
            (keydown.enter)="navigateTo('/opportunities')"
            (keydown.space)="navigateTo('/opportunities'); $event.preventDefault()"
            tabindex="0"
            role="link"
          >
            <p>Opportunities</p>
          </div>
        </div>
      }
    </div>
    @if (showIdeasPage) {
      <div
        class="navbar__menu__items"
        routerLink="/gsoc"
        [class.active]="isRouteActive('/gsoc')"
        (click)="navigateTo('/gsoc')"
        (keydown.enter)="navigateTo('/gsoc')"
        (keydown.space)="navigateTo('/gsoc'); $event.preventDefault()"
        tabindex="0"
        role="link"
        [attr.aria-label]="'Google Summer of Code'"
      >
        <img src="../../../assets/gsoc.svg" alt="GSoC Icon" class="menu-icon" />
        <p>GSoC {{ currentYearShort }}</p>
      </div>
    }

  <div class="navbar__right-actions">
    <button
      class="sun-moon-toggle"
      type="button"
      aria-label="Toggle color mode"
      title="Toggle color mode"
      (click)="toggleMode()"
    >
      <div class="sun" [class.visible]="isSunVisible"></div>
      <div class="moon" [class.visible]="!isSunVisible">
        <div class="star"></div>
        <div class="star small"></div>
      </div>
    </button>

    <div
      class="navigation__buttons"
      (click)="toggleMenu()"
      (keydown.enter)="toggleMenu()"
      (keydown.space)="toggleMenu(); $event.preventDefault()"
      tabindex="0"
      role="button"
      [attr.aria-label]="isMenuOpen ? 'Close menu' : 'Open menu'"
    >
      <div class="nav-btn">
        <img src="../../../assets/ham-menu.svg" alt="Open menu" />
      </div>
    </div>
  </div>
</div>
